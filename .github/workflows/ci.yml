name: CI Pipeline on Pull Request

on:
  pull_request:
    branches: [ dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-projet:test .

      - name: Run container and smoke test
        run: |
          docker run -d -p 5000:5000 --name test-app devops-projet:test
          sleep 3
          chmod +x smoke.sh
          ./smoke.sh
          docker stop test-app
